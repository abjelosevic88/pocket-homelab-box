# Publishes the installer ISOs as a GitHub release: the full one (every app) and Pocket Box Lite
# (Pocket Core and the base apps; the rest download on the first boot or from Core → Install an app).
#
#   push a tag vYYYY.MM.DD (on a commit CI already passed), or run it by hand with that tag
#   test build: run it by hand with publish = false and any branch or commit as the tag; the ISO is
#   then kept as a private workflow artifact (14 days) and nothing is released
#
# The ISO is built from the Cachix cache where it can be, split into parts under GitHub's 2 GB
# limit per file, and released with its checksum and the app versions (scripts/release-notes.py).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (it must exist); for a test build, any branch or commit
        required: true
      publish:
        description: Publish a GitHub release (off = test build, kept as a workflow artifact only)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pocket-box-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # A tag push always publishes; by hand it follows the switch.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Make room (the ISO, its parts and the store)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Pull only: the release is the same system CI already pushed.
          skipPush: true

      - name: Build the installer ISO
        run: nix build --print-build-logs .#iso

      - name: Split it and write the checksums
        run: |
          mkdir dist
          iso="pocket-box-installer-$TAG.iso"
          src=$(echo result/iso/*.iso)
          ls -l "$src"
          (cd dist && sha256sum "$OLDPWD/$src" | awk -v n="$iso" '{print $1 "  " n}' > "$iso.sha256")
          split --bytes=1900M --numeric-suffixes --suffix-length=2 "$src" "dist/$iso.part"
          (cd dist && sha256sum "$iso".part* > "pocket-box-installer-$TAG-parts.sha256")
          ls -l dist
          cat dist/*.sha256
          echo "ISO=$iso" >> "$GITHUB_ENV"

      - name: Build Pocket Box Lite's installer ISO
        run: |
          rm -f result
          nix build --print-build-logs --out-link result-lite .#iso-lite
          lite="pocket-box-lite-installer-$TAG.iso"
          src=$(echo result-lite/iso/*.iso)
          (cd dist && sha256sum "$OLDPWD/$src" | awk -v n="$lite" '{print $1 "  " n}' > "$lite.sha256")
          # One file while it fits under GitHub's 2 GB limit per file, else parts like the full ISO.
          if [ "$(stat -c %s "$src")" -lt 1990000000 ]; then
            cp "$src" "dist/$lite"
          else
            split --bytes=1900M --numeric-suffixes --suffix-length=2 "$src" "dist/$lite.part"
            echo "LITE_PARTS=$(cd dist && ls "$lite".part* | sort | tr '\n' ' ')" >> "$GITHUB_ENV"
          fi
          ls -l dist
          echo "LITE_ISO=$lite" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          python3 scripts/release-notes.py "$TAG" "$ISO" $(cd dist && ls "$ISO".part* | sort) > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Name a test build after its commit
        if: env.PUBLISH != 'true'
        run: |
          rev=$(git rev-parse --short HEAD)
          for f in dist/*; do mv "$f" "${f//$TAG/test-$rev}"; done
          sed -i "s/$TAG/test-$rev/g" dist/*.sha256
          echo "TEST_NAME=pocket-box-installer-test-$rev" >> "$GITHUB_ENV"
          ls -l dist

      - name: Keep the test build (no release)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_NAME }}
          path: dist/
          retention-days: 14
          compression-level: 0

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Pocket Box $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
